name: "Deploy docs"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.29.0)"
        required: true
  release:
    types: [published]

permissions:
  contents: write
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    env:
      DOCS_BASE_URL: https://karlmoresco.github.io/pixelator
    steps:
      - id: ver
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group docs
      - name: Build docs
        env:
          DOCS_VERSION: ${{ steps.ver.outputs.version }}
        run: uv run sphinx-build -b html docs docs/_build/html --keep-going -n
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/_build/html
          destination_dir: docs/${{ steps.ver.outputs.version }}
          keep_files: true
          
      - name: Checkout gh-pages (for regenerating switcher.json)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Regenerate switcher.json
        run: uv run python docs/_scripts/update_switcher.py
      
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./switcher-out
          destination_dir: docs
          keep_files: true
    
      - name: Print docs URL
        env:
          DOCS_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          DOCS_URL="${DOCS_BASE_URL}/${DOCS_VERSION}/"
          echo "Docs URL: $DOCS_URL"
          echo "DOCS_URL=$DOCS_URL" >> "$GITHUB_ENV"
          echo "### Docs published" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DOCS_URL" >> "$GITHUB_STEP_SUMMARY"
      
