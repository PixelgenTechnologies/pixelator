#schema: https://github.com/softprops/github-actions-schemas/blob/master/workflow.json
name: "Build containers"

on:
  push:
    branches: [main, dev]
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  actions: write
  contents: read
  packages: write

jobs:
  pre_job:
    continue-on-error: true
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        if: ${{ !github.event.act }}
        with:
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "true"
          do_not_skip: '["workflow_dispatch"]'
          paths_filter: |
            python:
              paths:
                - 'pyproject.toml'
                - 'src/**'
                - 'containers/**'
                - '.github/actions/setup-image-build-env/action.yml'
                - '.github/actions/build-dev-image/action.yml'
                - '.github/workflows/build.yml'
                - '.github/workflows/nf-core-pipeline-test.yml'

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [pre_job]
    # Release tags and `main` always build: the release commit only touches the changelog,
    # so the path filter would skip it after the earlier successful run on `dev`.
    if: >-
      github.ref_type == 'tag' ||
      github.ref == 'refs/heads/main' ||
      needs.pre_job.outputs.paths_result == '{}' ||
      !fromJSON(needs.pre_job.outputs.paths_result).python.should_skip
    outputs:
      image: ${{ steps.image_ref.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up build environment
        id: setup_build_env
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Build and push images
        id: build_image
        uses: ./.github/actions/build-dev-image
        with:
          cache-from: "type=registry,ref=ghcr.io/pixelgentechnologies/pixelator:dev-buildcache"
          cache-to: "type=registry,ref=ghcr.io/pixelgentechnologies/pixelator:dev-buildcache,mode=max"

      # Pick the immutable `sha-<commit>` tag on ghcr.io for the downstream tests,
      # so later pushes to the same PR or branch cannot swap the image under them.
      - name: Select image for downstream tests
        id: image_ref
        env:
          TAGS: ${{ steps.build_image.outputs.tags }}
        run: |
          image=$(echo "$TAGS" | grep -m1 '^ghcr.io/pixelgentechnologies/pixelator:sha-' || true)
          if [[ -z "$image" ]]; then
            image=$(echo "$TAGS" | grep -m1 '^ghcr.io/pixelgentechnologies/pixelator:' || true)
          fi
          if [[ -z "$image" ]]; then
            echo "::error::No ghcr.io image tag found in: $TAGS"
            exit 1
          fi
          echo "Image for downstream tests: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  nf-core-pipeline-test:
    name: "nf-core/pixelator"
    needs: [build]
    uses: ./.github/workflows/nf-core-pipeline-test.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.build.outputs.image }}
      pipeline-ref: "dev"
